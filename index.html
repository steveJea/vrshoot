<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIOLENCE ROYALE - SHOOTING MASTERS</title>

<!-- Favicon -->
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="shortcut icon" href="favicon.png" type="image/png">

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-NP3VPPBRKL"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-NP3VPPBRKL');

<link rel="stylesheet" href="css/style.css">

<title>VR Shooting Masters | 슈팅 액션을 즐겨보세요</title>
<meta name="description" content="VR Shooting Masters - Violance Royale 시리즈의 슈팅 액션 게임. PC에서 박진감 넘치는 슈팅을 경험하세요.">
<meta name="keywords" content="VR Shooting Masters, 슈팅 게임, Violance Royale, 웹 슈팅, PC 게임">
</head>
<body>

<div id="title-screen" class="screen active">
  <h1>VIOLENCE ROYALE</h1>
  <div class="sub">THE BRUTAL CITY</div>
  <div class="game-title">SHOOTING MASTERS</div>
  <div class="start-msg">Press Any Key to START</div>
</div>

<div id="select-screen" class="screen">
  <h2>Select Your Fighter</h2>
  <div class="char-grid" id="char-grid"></div>
  <div class="boss-area" id="boss-area"></div>
</div>

<div class="modal-overlay" id="profile-modal">
  <div class="modal-box">
    <img id="modal-img" src="" alt="">
    <div class="m-name" id="modal-name"></div>
    <div class="m-stats">
      <div><span>Pwr</span> : <b id="modal-pwr"></b></div>
      <div><span>Eng</span> : <b id="modal-eng"></b></div>
      <div><span>Spd</span> : <b id="modal-spd"></b></div>
      <div><span>Bomb</span> : <b id="modal-bomb"></b></div>
    </div>
    <div class="modal-btns">
      <button class="btn-confirm" id="modal-confirm">CONFIRM</button>
      <button class="btn-close" id="modal-close">CLOSE</button>
    </div>
  </div>
</div>

<div id="vs-screen" class="screen">
  <div class="vs-container" id="vs-normal">
    <div class="vs-char"><img id="vs-player-img" src="" alt=""><div class="name" id="vs-player-name"></div></div>
    <div class="vs-text">VS</div>
    <div class="vs-char"><img id="vs-enemy-img" src="" alt=""><div class="name" id="vs-enemy-name"></div></div>
  </div>
  <div id="vs-boss" style="display:none;width:100%;height:100%;justify-content:center;align-items:center;position:relative">
    <img id="vs-boss-img" class="boss-vs-img" src="" alt="">
    <div class="boss-vs-name" id="vs-boss-name"></div>
  </div>
</div>

<div id="battle-screen" class="screen">
  <div id="battle-ui">
    <div class="hp-box">
      <div class="face-score">
        <img id="player-face" src="" alt="">
        <div class="score-num" id="player-score">0</div>
      </div>
      <div class="hp-bar-wrap">
        <div class="hp-bar" id="player-hp-bar"></div>
        <div class="hp-pct" id="player-hp-pct">100.0%</div>
      </div>
    </div>
    <div class="center-info">
      <div id="round-info">ROUND 1</div>
      <div class="timer" id="timer">120</div>
    </div>
    <div class="hp-box" style="flex-direction:row-reverse">
      <div class="face-score">
        <img id="enemy-face" src="" alt="">
        <div class="score-num" id="enemy-score">0</div>
      </div>
      <div class="hp-bar-wrap">
        <div class="hp-bar" id="enemy-hp-bar"></div>
        <div class="hp-pct" id="enemy-hp-pct">100.0%</div>
      </div>
    </div>
  </div>
  <canvas id="battle-canvas"></canvas>
  <div class="battle-info">←→↑↓ / WASD 이동 | SPACE : 공격 | Q : 특수공격 (1회)</div>
</div>

<div id="victory-screen" class="screen result-screen">
  <div class="result-title win">YOU WIN</div>
  <div class="result-faces"><img id="vic-player" src="" alt=""><img id="vic-enemy" src="" alt=""></div>
  <div class="win-txt" id="vic-txt"></div>
</div>

<div id="fail-screen" class="screen result-screen">
  <div class="result-title lose">YOU LOSE</div>
  <div class="result-faces"><img id="fail-player" src="" alt=""><img id="fail-enemy" src="" alt=""></div>
  <div class="win-txt" id="fail-txt"></div>
</div>

<div id="continue-screen" class="screen">
  <div class="continue-wrap">
    <img id="con-img" src="" alt="">
    <div class="continue-right">
      <div class="label">CONTINUE?</div>
      <div id="con-count">10.00</div>
      <div class="hint">Press Any Key</div>
      <div class="remain">Remaining Continues : <span id="con-left">3</span></div>
    </div>
  </div>
</div>

<div id="ending-screen" class="screen">
  <img id="ending-img" src="" alt="">
  <div id="ending-txt"></div>
  <div id="ending-hint">클릭하면 전체 텍스트가 표시됩니다</div>
</div>

<div id="gameover-screen" class="screen"><h1>GAME OVER</h1></div>

<!-- Scripts (순서 중요) -->
<script src="js/data.js"></script>
<script src="js/audio.js"></script>
<script src="js/ui.js"></script>
<script src="js/battle.js"></script>
<script src="js/main.js"></script>

</body>
</html>
